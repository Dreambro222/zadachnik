# nginx reverse-proxy in front of `outreach webhook --serve`.
#
# How this gets installed:
#   1. `deploy/bootstrap.sh` copies this file to /etc/nginx/sites-available/outreach
#      with envsubst replacing ${DOMAIN}.
#   2. certbot --nginx -d ${DOMAIN} adds the TLS lines automatically.
#
# Why behind nginx and not bare:
#   - TLS termination (Smartlead requires HTTPS on webhook URL)
#   - Header passthrough for X-Smartlead-Signature
#   - Standard logs go through journalctl + /var/log/nginx for audit
#   - Easy to add Basic-Auth or IP allowlist later if Smartlead leaks the URL

server {
    server_name ${DOMAIN};
    listen 80;

    # Health check — useful for uptime monitors. No auth needed.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Privacy policy — POPIA s.69 requires this URL to resolve.
    location = /privacy {
        alias /var/www/outreach/privacy-policy.html;
        default_type text/html;
    }

    # The actual webhook receiver.
    location /webhook/smartlead {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Critical: this header carries the HMAC signature.
        proxy_set_header X-Smartlead-Signature $http_x_smartlead_signature;

        # Smartlead's largest event payload is ~30 KB. Cap at 1 MB so we
        # don't accept obvious garbage.
        client_max_body_size 1m;

        # Short timeouts — webhook dispatch is sync and should be <1s.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # Block everything else by default.
    location / {
        return 404 "not found\n";
    }
}
