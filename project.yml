name: "Задачник"
options:
  bundleIdPrefix: com.cek
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "M6Z3JL885D"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  "Задачник":
    type: application
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: "Задачник"
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cek.zadachnik
        INFOPLIST_FILE: "Задачник/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "Задачник/Zadachnik.entitlements"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        # macOS Catalyst not used — native SwiftUI for both
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: "Задачник/Info.plist"
      properties:
        CFBundleName: "Задачник"
        CFBundleDisplayName: "Задачник"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        NSMicrophoneUsageDescription: "Задачник использует микрофон для записи голосовых заметок и звонков"
        NSSpeechRecognitionUsageDescription: "Задачник использует распознавание речи для автоматической транскрибации голосовых записей и звонков"
        NSCameraUsageDescription: "Задачник использует камеру для фото в прикреплённых файлах"
        NSCalendarsUsageDescription: "Задачник добавляет дедлайны проектов и задач в ваш Календарь (синхронизируется с Google Calendar)"
        NSCalendarsFullAccessUsageDescription: "Задачник добавляет и обновляет события дедлайнов в вашем Календаре, который синхронизируется с Google Calendar"
        NSUserNotificationAlertStyle: "alert"

schemes:
  Zadachnik:
    build:
      targets:
        "Задачник": all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
